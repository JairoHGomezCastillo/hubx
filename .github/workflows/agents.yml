name: agents

# The Kiro and Claude Code agents are generated from .opencode/agents (make agents-sync).
# This check fails the PR if someone edited a source agent without regenerating them, or edited a generated file.
on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  agents-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: make agents-check
      # PRs into any integration branch (every base except main): each [agent:<role>] commit stays inside its zone.
      - if: github.event_name == 'pull_request' && github.base_ref != 'main'
        run: make agents-zones BASE=origin/${{ github.base_ref }}
