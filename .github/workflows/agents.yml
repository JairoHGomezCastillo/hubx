name: agents

# The Kiro and Claude Code agents are generated from .opencode/agents (make agents-sync).
# This check fails the PR if someone edited a source agent without regenerating them, or edited a generated file.
on:
  pull_request:
  push:
    branches: [main, "release/**", "hotfix/**"]

permissions:
  contents: read

jobs:
  agents-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: make agents-check
      # Story PRs into a release branch: each [agent:<role>] commit stays inside its role's paths.
      - if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/')
        run: make agents-zones BASE=origin/${{ github.base_ref }}
