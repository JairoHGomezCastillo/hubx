name: deploy-staging

# Every PR merged into an integration branch (any base except main, whatever its name) goes to staging.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  packages: read

jobs:
  staging:
    if: github.event.pull_request.merged == true && github.base_ref != 'main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      ref: ${{ github.event.pull_request.merge_commit_sha }}
    secrets: inherit
