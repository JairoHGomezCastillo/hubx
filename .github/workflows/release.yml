name: release

# Every release/vX.Y.Z[-name] or hotfix/vX.Y.Z branch merged into main is tagged vX.Y.Z on its merge commit and gets a
# GitHub Release with notes generated from its PRs. After a hotfix, a PR syncs main into the open release branch so
# the next version does not lose the fix, and the job `deploy` promotes the release tip to production. Humans still
# merge; this only records and deploys what was merged.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.head_ref, 'release/v') || startsWith(github.head_ref, 'hotfix/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: ${{ github.head_ref }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the version from the branch name
        id: version
        run: bash scripts/release-version.sh "$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Tag and publish the GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TITLE: ${{ steps.version.outputs.title }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists; use a new version in the branch name"
            exit 1
          fi
          # Notes cover the PRs since the previous version tagged on main, if there is one.
          previous=$(git describe --tags --abbrev=0 "$MERGE_SHA^1" 2>/dev/null || true)
          gh release create "$VERSION" --target "$MERGE_SHA" --title "$TITLE" --generate-notes \
            ${previous:+--notes-start-tag "$previous"}
          echo "Released $VERSION from PR #$PR_NUMBER ($HEAD_REF)" >> "$GITHUB_STEP_SUMMARY"


  # A hotfix must reach the open integration branches. Its own job, so a failure here (for example when Actions may
  # not create pull requests: Settings -> Actions -> General) never blocks the production deploy; it only warns.
  sync:
    needs: tag
    if: startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.tag.outputs.version }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync a hotfix into every open integration branch
        run: |
          # Integration branches have no fixed name: they are the bases of open PRs (other than main) plus any
          # release/* still open. Each gets one sync PR from main, unless it already contains main or has one open.
          mapfile -t targets < <( { gh pr list --state open --json baseRefName --jq '.[].baseRefName';
                                    git ls-remote --heads origin 'release/*' | sed 's#.*refs/heads/##'; } \
                                  | grep -vx main | sort -u )
          for base in "${targets[@]}"; do
            git ls-remote --exit-code --heads origin "$base" >/dev/null || continue
            if git merge-base --is-ancestor origin/main "origin/$base"; then
              echo "$base already contains main" >> "$GITHUB_STEP_SUMMARY"; continue
            fi
            if [ -n "$(gh pr list --state open --base "$base" --head main --json number --jq '.[].number')" ]; then
              continue
            fi
            gh pr create --base "$base" --head main \
              --title "chore(release): 🔀 sync hotfix $VERSION into $base" \
              --body "Hotfix $VERSION was merged into main (PR #$PR_NUMBER). This PR brings it into $base so the next version keeps the fix." \
              || { echo "::warning::could not open the sync PR into $base: open it by hand (main -> $base)"; }
          done
          [ "${#targets[@]}" -gt 0 ] || echo "No open integration branch; nothing to sync." >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # Production (constitution 1.5.0, build once): deploys the images of the release tip, the commit staging deployed
  # and smoke-tested, after the tag exists. The merge commit has the same tree (release-source requires the release to
  # contain main). Switched on by the repository variable DEPLOY_PRODUCTION=true once the environment `production`
  # exists and the services are image-backed (deploy/README.md); production runs only the read-only @smoke scenarios.
  deploy:
    needs: tag
    if: vars.DEPLOY_PRODUCTION == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
