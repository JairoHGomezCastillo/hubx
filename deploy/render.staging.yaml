# Staging on Render (free): image-backed services. They never build or follow a branch: .github/workflows/deploy.yml
# points them at the images of any commit (ghcr.io/<owner>/hubx-<service>:<sha>) through the Render API.
# The `:main` tag below is only the image used when the Blueprint is first created.
services:
  - type: web
    name: hubx-api-stg
    runtime: image
    plan: free
    image:
      url: ghcr.io/jairohgomezcastillo/hubx-api:main
    # The API returns 401 without the gateway secret, so it has no healthCheckPath.
    envVars:
      # Neon DIRECT connection string of the `staging` branch of the database (sslmode=require).
      - key: DB_URL
        sync: false
      - fromGroup: hubx-stg-secrets

  - type: web
    name: hubx-gw-stg
    runtime: image
    plan: free
    image:
      url: ghcr.io/jairohgomezcastillo/hubx-gw:main
    healthCheckPath: /health
    envVars:
      # Public HTTPS URL of hubx-api-stg (a Blueprint cannot resolve it): https://hubx-api-stg.onrender.com
      - key: API_URL
        sync: false
      - fromGroup: hubx-stg-secrets

  - type: web
    name: hubx-mfe-stg
    runtime: image
    plan: free
    image:
      url: ghcr.io/jairohgomezcastillo/hubx-mfe:main
    envVars:
      # Public HTTPS URL of hubx-gw-stg: https://hubx-gw-stg.onrender.com
      - key: GATEWAY_URL
        sync: false

envVarGroups:
  - name: hubx-stg-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: GATEWAY_SECRET
        generateValue: true
