# Production on Render (free), Blueprint exs-dc2ijnui0phs73avl4l0 linked to main: image-backed services. They never
# build or follow a branch: after tagging, release.yml (job deploy -> deploy.yml) points them at the images of the
# merged PR head (ghcr.io/<owner>/hubx-<service>:<sha>). `:main` is only the image a sync applies.
services:
  - type: web
    name: hubx-api
    runtime: image
    plan: free
    image:
      url: ghcr.io/jairohgomezcastillo/hubx-api:main
    # The API returns 401 without the gateway secret, so it has no healthCheckPath.
    envVars:
      # Neon DIRECT connection string (not the pooled one), with sslmode=require.
      # Set in the Render dashboard during Blueprint creation.
      - key: DB_URL
        sync: false
      - fromGroup: hubx-secrets

  - type: web
    name: hubx-gw
    runtime: image
    plan: free
    image:
      url: ghcr.io/jairohgomezcastillo/hubx-gw:main
    healthCheckPath: /health
    envVars:
      # Public HTTPS URL of hubx-api. A Blueprint cannot resolve a service's
      # public .onrender.com URL (fromService host is the private name only),
      # so set this by hand after the first deploy. See deploy/README.md.
      - key: API_URL
        sync: false
      - fromGroup: hubx-secrets

  - type: web
    name: hubx-mfe
    runtime: image
    plan: free
    image:
      url: ghcr.io/jairohgomezcastillo/hubx-mfe:main
    envVars:
      # Public HTTPS URL of hubx-gw. Same limitation as API_URL above:
      # set by hand after the gateway's first deploy. See deploy/README.md.
      - key: GATEWAY_URL
        sync: false

envVarGroups:
  - name: hubx-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: GATEWAY_SECRET
        generateValue: true
