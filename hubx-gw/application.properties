# hubx-gw configuration. No secrets here: jwt.secret and gateway.secret come only from the environment (JWT_SECRET, GATEWAY_SECRET).
server.port=8080
api.url=http://localhost:8081
# Empty: no cross origin is allowed. Local Vite proxies /api same-origin, so it needs none.
cors.allowed-origins=
ratelimit.requests-per-minute=120
ratelimit.sign-in-requests-per-minute=10
jwt.secret=
gateway.secret=
