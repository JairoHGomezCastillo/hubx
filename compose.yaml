# Local stack: PostgreSQL -> migrate -> hubx-api -> hubx-gw -> hubx-mfe. Use `make up` / `make down`.
# Secrets come from .env (git-ignored), which `make` generates with random values on first run.
name: hubx

services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: hubx
      POSTGRES_USER: hubx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make up to generate .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubx -d hubx"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: ./hubx-api
    image: hubx-api:local
    entrypoint: ["/app/migrate"]
    environment:
      DB_URL: postgres://hubx:${POSTGRES_PASSWORD}@postgres:5432/hubx?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: hubx-api:local
    environment:
      DB_URL: postgres://hubx:${POSTGRES_PASSWORD}@postgres:5432/hubx?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?run make up to generate .env}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?run make up to generate .env}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully

  gw:
    build: ./hubx-gw
    image: hubx-gw:local
    environment:
      API_URL: http://api:8081
      JWT_SECRET: ${JWT_SECRET:?run make up to generate .env}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      RATELIMIT_REQUESTS_PER_MINUTE: ${RATELIMIT_REQUESTS_PER_MINUTE:-120}
      RATELIMIT_SIGN_IN_REQUESTS_PER_MINUTE: ${RATELIMIT_SIGN_IN_REQUESTS_PER_MINUTE:-10}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api

  # Test profile only (make test-integration): the same gateway image with the limits fixed low, so the rate limit
  # scenarios (@needs-limited-gateway) can hit 429 without the main gateway's budget being exhausted.
  gw-limited:
    image: hubx-gw:local
    profiles: ["test"]
    environment:
      API_URL: http://api:8081
      JWT_SECRET: ${JWT_SECRET:?run make up to generate .env}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      RATELIMIT_REQUESTS_PER_MINUTE: "5"
      RATELIMIT_SIGN_IN_REQUESTS_PER_MINUTE: "3"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      - api
      - gw

  mfe:
    build: ./hubx-mfe
    image: hubx-mfe:local
    environment:
      GATEWAY_URL: http://gw:8080
    ports:
      - "127.0.0.1:${MFE_PORT:-3000}:8080"
    depends_on:
      - gw

volumes:
  pgdata:
